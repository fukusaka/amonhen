name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 1 つの crate で落ちても、ほかの crate の試験は最後まで流す。
      - run: cargo test --workspace --no-fail-fast
      # build.rs が生成する C のヘッダーがコミット済みのものと一致するか。
      - run: git diff --exit-code crates/ffi-c/include

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-core.sh
      - run: swift test
        working-directory: apps/macos

  # コアに OS 固有のコードが紛れ込まないよう、全ターゲットで型検査だけ通す。
  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, aarch64-apple-ios, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: |
          for target in aarch64-apple-darwin aarch64-apple-ios x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-linux-android; do
            echo "::group::$target"
            # 構文の色付けの文法は C で書かれていて、ターゲットごとの C コンパイラ（MSVC・iOS の SDK など）が要るので外す。
            cargo check --workspace --lib --no-default-features --exclude amonhen-syntax --target "$target"
            echo "::endgroup::"
          done

  # GTK4 のアプリ（apps/gtk4。別の workspace）。Ubuntu 24.04 の GTK は 4.14。
  gtk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gtk4
      - run: cargo fmt --check
        working-directory: apps/gtk4
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/gtk4
      # 配る形（tar.gz）にまとめられるか。エンジンは入れない（リリースでは scripts/build-engine.sh の分を入れる）。
      - run: scripts/package-gtk4.sh

  # 配るものに入る依存が、許したライセンスだけか（deny.toml）。
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny check licenses

  # VSCode 拡張（apps/vscode）。daemon の試験に、このリポジトリのエンジンを使う（Windows は名前付きパイプ）。
  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # 試験は改行を変えない前提（Windows の CI は autocrlf が有効）。
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p amonhen-cli
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - working-directory: apps/vscode
        run: |
          npm ci
          npm run typecheck
          npm test
      # VSCode を起動する結合テスト（e2e/）。ダウンロードした VSCode はキャッシュする。Linux は画面がないので xvfb で
      - uses: actions/cache@v4
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/vscode/.vscode-test.mjs') }}
      - working-directory: apps/vscode
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:e2e
