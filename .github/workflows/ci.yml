name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定では何も許さず、要るものだけをジョブで許す。
permissions: {}

# 同じブランチ・PR に新しく push したら、前の実行はやめる。main はコミットごとに別の組にして、止めも待たせもしない
# （正式版を出す前に、そのコミットの CI が通ったことを確かめるので）。
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 1 つの crate で落ちても、ほかの crate の試験は最後まで流す。
      - run: cargo test --workspace --no-fail-fast
      # build.rs が生成する C のヘッダーがコミット済みのものと一致するか。
      - run: git diff --exit-code crates/ffi-c/include

  # サポートする最低の git（docs/install.md の「Requirements」）で試験を流し、新しい git にしかない機能を使って
  # いないか（使うなら古いやり方に戻しているか）を確かめる。git はソースから作り、作ったものをキャッシュする。
  git-minimum:
    name: Minimum git
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # コミットを取ってくる
    env:
      GIT_VERSION: 2.23.4
      GIT_SHA256: d008bf4461f7cf92405a67851456496e5e5f6c495064c1058d2de6a390d8bb60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: git-minimum
      - id: git-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/git-minimum
          key: git-${{ env.GIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfLO "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_VERSION.tar.xz"
          echo "$GIT_SHA256  git-$GIT_VERSION.tar.xz" | sha256sum -c -
          tar xf "git-$GIT_VERSION.tar.xz"
          # 試験に要らないもの（HTTP・翻訳・Perl・Python・Tcl/Tk）は外す。
          make -C "git-$GIT_VERSION" -j"$(nproc)" prefix="$HOME/git-minimum" \
            NO_CURL=1 NO_EXPAT=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_TCLTK=1 install
      # 試験は手元の git の設定を GIT_CONFIG_GLOBAL で読ませないが、これは git 2.32 からなので、HOME を空にする。
      - run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export PATH="$HOME/git-minimum/bin:$PATH"
          git --version | grep -qx "git version $GIT_VERSION"
          HOME="$(mktemp -d)" cargo test --workspace --no-fail-fast
      # VSCode 拡張の git 実行層も同じ git で試す（daemon の試験が使う amonhen もここで作る）。コアの試験が落ちても流す。
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - if: ${{ !cancelled() }}
        working-directory: apps/vscode
        run: |
          cargo build -p amonhen-cli
          npm ci
          export PATH="$HOME/git-minimum/bin:$PATH"
          git --version | grep -qx "git version $GIT_VERSION"
          HOME="$(mktemp -d)" npm test
      # VSCode を起動する結合テストも同じ git で。VSCode は PATH ではなく自分で git を探すので、AMONHEN_E2E_GIT で渡す。
      - if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/vscode/.vscode-test.mjs') }}
      - if: ${{ !cancelled() }}
        working-directory: apps/vscode
        run: |
          export PATH="$HOME/git-minimum/bin:$PATH"
          AMONHEN_E2E_GIT="$HOME/git-minimum/bin/git" xvfb-run -a npm run test:e2e

  swift:
    name: Swift
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/build-core.sh
      - run: swift test
        working-directory: apps/macos

  # コアに OS 固有のコードが紛れ込まないよう、全ターゲットで型検査だけ通す。
  targets:
    name: Targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin,aarch64-apple-ios,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-linux-android
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          for target in aarch64-apple-darwin aarch64-apple-ios x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-linux-android; do
            echo "::group::$target"
            # 構文の色付けの文法は C で書かれていて、ターゲットごとの C コンパイラ（MSVC・iOS の SDK など）が要るので外す。
            cargo check --workspace --lib --no-default-features --exclude amonhen-syntax --target "$target"
            echo "::endgroup::"
          done

  # GTK4 のアプリ（apps/gtk4。別の workspace）。Ubuntu 24.04 の GTK は 4.14。
  gtk:
    name: GTK4 app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint がまだ $/ の書き方を読めないので、./ で呼ぶ。
      - uses: ./.github/actions/apt-install # zizmor: ignore[self-repository]
        with:
          packages: libgtk-4-dev libadwaita-1-dev
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/gtk4
      - run: cargo fmt --check
        working-directory: apps/gtk4
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/gtk4
      # 操作の表（amonhen-commands）のどの操作にも、処理があるか PENDING にあるか。画面は要らない。
      - run: cargo test
        working-directory: apps/gtk4
      # 配る形（tar.gz）にまとめられるか。エンジンは入れない（リリースでは scripts/build-engine.sh の分を入れる）。
      - run: scripts/package-gtk4.sh

  # 配るものに入る依存が、許したライセンスだけか（deny.toml）。
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny
      - run: cargo deny check licenses

  # VSCode 拡張（apps/vscode）。daemon の試験に、このリポジトリのエンジンを使う（Windows は名前付きパイプ）。
  vscode:
    name: VSCode extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    defaults:
      run:
        shell: bash
    steps:
      # 試験は改行を変えない前提（Windows の CI は autocrlf が有効）。
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p amonhen-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - working-directory: apps/vscode
        run: |
          npm ci
          npm run typecheck
          npm test
      # VSCode を起動する結合テスト（e2e/）。ダウンロードした VSCode はキャッシュする。Linux は画面がないので xvfb で
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/vscode/.vscode-test.mjs') }}
      - working-directory: apps/vscode
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi
