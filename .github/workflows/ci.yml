name: CI

# テストが通ったら、main への push では snapshot という pre-release を作り直す（テストが落ちたコミットは配らない。
# main が先に進んでいたら、先のコミットの CI に任せる）。
# snapshot は署名するが公証はしない。
on:
  push:
    branches: [main]
  pull_request:
    # 文書だけを変えた PR では流さない（検査するものがない）。main への push では、snapshot と正式版の前の確認のために
    # いつも流す。Windows のアプリと文書だけなら、macOS のジョブだけを省く（scripts/ci-needs-macos.sh）。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# 既定では何も許さず、要るものだけをジョブで許す。
permissions: {}

# 同じブランチ・PR に新しく push したら、前の実行はやめる。main はコミットごとに別の組にして、止めも待たせもしない
# （正式版を出す前に、そのコミットの CI が通ったことを確かめるので）。
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS のジョブを流すか（scripts/ci-needs-macos.sh。Windows のアプリと文書だけを変えた PR では流さない）。
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # コミットを取ってくる
      pull-requests: read # PR が変えたファイルの一覧
    outputs:
      macos: ${{ steps.decide.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        run: scripts/ci-needs-macos.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  test:
    name: Rust (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.macos == 'true' && '["macos-latest","ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      # macOS では Swift の試験のために release のコアも作るので、キャッシュを別の名前にする。同じ名前のキャッシュが
      # あると置き直さないので、debug だけのキャッシュが残り、release を毎回作り直してしまう。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os == 'macOS' && 'swift' || '' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 1 つの crate で落ちても、ほかの crate の試験は最後まで流す。
      - run: cargo test --workspace --no-fail-fast
      # build.rs が生成する C のヘッダーがコミット済みのものと一致するか。
      - run: git diff --exit-code crates/ffi-c/include
      # macOS のアプリ（apps/macos）の試験。macOS のランナーは数が少なく待ちが長いので、別のジョブにせずここで流す。
      # Rust の試験が落ちても流す。
      - if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: scripts/build-core.sh
      - if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: swift test
        working-directory: apps/macos

  # サポートする最低の git（docs/install.md の「Requirements」）で試験を流し、新しい git にしかない機能を使って
  # いないか（使うなら古いやり方に戻しているか）を確かめる。git はソースから作り、作ったものをキャッシュする。
  git-minimum:
    name: Minimum git
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # コミットを取ってくる
    env:
      GIT_VERSION: 2.23.4
      GIT_COMMIT: d60b6a96f087ea5ad530b71096a604c993fd9e71 # git/git の v2.23.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: git-minimum
      - id: git-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/git-minimum
          key: git-${{ env.GIT_COMMIT }}-${{ runner.os }}-${{ runner.arch }}
      # ソースは GitHub の git/git から、コミットを決めて取る（GitHub の外には取りに行かない）。
      - if: steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: git/git
          ref: ${{ env.GIT_COMMIT }}
          path: git-src
          persist-credentials: false
      - if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          # タグのない checkout なので、版は `version` に書いて決める（配布の tar と同じ）。
          echo "$GIT_VERSION" > git-src/version
          # 試験に要らないもの（HTTP・翻訳・Perl・Python・Tcl/Tk）は外す。C の規格は C17 に決める: 今の gcc の
          # 既定（C23）では `thread_local` が予約語で、この版の git（`struct thread_local`）はコンパイルできない。
          make -C git-src -j"$(nproc)" prefix="$HOME/git-minimum" CFLAGS="-g -O2 -std=gnu17" \
            NO_CURL=1 NO_EXPAT=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_TCLTK=1 install
          # 作り終えたら消す（リポジトリの中に別のリポジトリを残さない）。
          rm -rf git-src
      # 試験は手元の git の設定を GIT_CONFIG_GLOBAL で読ませないが、これは git 2.32 からなので、HOME を空にする。
      - run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export PATH="$HOME/git-minimum/bin:$PATH"
          git --version | grep -qx "git version $GIT_VERSION"
          HOME="$(mktemp -d)" cargo test --workspace --no-fail-fast
      # VSCode 拡張の git 実行層も同じ git で試す（daemon の試験が使う amonhen もここで作る）。コアの試験が落ちても流す。
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - if: ${{ !cancelled() }}
        working-directory: apps/vscode
        run: |
          cargo build -p amonhen-cli
          cargo build -p amonhen-render
          npm ci
          export PATH="$HOME/git-minimum/bin:$PATH"
          git --version | grep -qx "git version $GIT_VERSION"
          HOME="$(mktemp -d)" npm test
      # VSCode を起動する結合テストも同じ git で。VSCode は PATH ではなく自分で git を探すので、AMONHEN_E2E_GIT で渡す。
      - if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/vscode/.vscode-test.mjs') }}
      - if: ${{ !cancelled() }}
        working-directory: apps/vscode
        run: |
          export PATH="$HOME/git-minimum/bin:$PATH"
          AMONHEN_E2E_GIT="$HOME/git-minimum/bin/git" xvfb-run -a npm run test:e2e

  # コアに OS 固有のコードが紛れ込まないよう、全ターゲットで型検査だけ通す。
  targets:
    name: Targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin,aarch64-apple-ios,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-linux-android
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          for target in aarch64-apple-darwin aarch64-apple-ios x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-linux-android; do
            echo "::group::$target"
            # 構文の色付けの文法は C で書かれていて、ターゲットごとの C コンパイラ（MSVC・iOS の SDK など）が要るので外す。
            cargo check --workspace --lib --no-default-features --exclude amonhen-syntax --target "$target"
            echo "::endgroup::"
          done

  # GTK4 のアプリ（apps/gtk4。別の workspace）。Ubuntu 24.04 の GTK は 4.14。
  gtk:
    name: GTK4 app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint がまだ $/ の書き方を読めないので、./ で呼ぶ。
      - uses: ./.github/actions/apt-install # zizmor: ignore[self-repository]
        with:
          packages: libgtk-4-dev libadwaita-1-dev
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/gtk4
      - run: cargo fmt --check
        working-directory: apps/gtk4
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/gtk4
      # 操作の表（amonhen-commands）のどの操作にも、処理があるか PENDING にあるか。画面は要らない。
      - run: cargo test
        working-directory: apps/gtk4
      # 配る形（tar.gz）にまとめられるか。エンジンは入れない（リリースでは scripts/build-engine.sh の分を入れる）。
      - run: scripts/package-gtk4.sh

  # Windows のアプリ（apps/windows。WinUI 3 を Rust から使う。windows-rs が要るので別の workspace）。画面は要らない。
  windows-app:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows
      - run: cargo fmt --check
        working-directory: apps/windows
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/windows
      - run: cargo test
        working-directory: apps/windows

  # 配るものに入る依存が、許したライセンスだけか（deny.toml）。
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny
      - run: cargo deny check licenses

  # VSCode 拡張（apps/vscode）。daemon の試験に、このリポジトリのエンジンを使う（Windows は名前付きパイプ）。
  vscode:
    name: VSCode extension (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.macos == 'true' && '["macos-latest","ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    defaults:
      run:
        shell: bash
    steps:
      # 試験は改行を変えない前提（Windows の CI は autocrlf が有効）。
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # 絵の手伝いは別に作る（一緒に作るとフィーチャーがエンジンに混ざる）。
      - run: cargo build -p amonhen-cli && cargo build -p amonhen-render
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - working-directory: apps/vscode
        run: |
          npm ci
          npm run typecheck
          npm test
      # VSCode を起動する結合テスト（e2e/）。ダウンロードした VSCode はキャッシュする。Linux は画面がないので xvfb で
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/vscode/.vscode-test.mjs') }}
      # Windows の runner は、起動して数分のうちに Windows Update（wuauserv・UsoSvc）とそれに続く Storage Service
      # （StorSvc）が 1 コア以上を数十秒使う。重なると e2e の git が 10 倍ほど遅れ、拡張ホストが止まって時間切れになる
      # ので、e2e の前に止める（使い捨ての VM なので戻さない）
      - if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci-quiet-windows.ps1
      - working-directory: apps/vscode
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi

  # snapshot は main の先頭のコミットだけ作る。snapshot-publish は先に進んだ main のものを載せないので、古いコミットの
  # snapshot は作っても捨てるだけで、macOS のランナー（同時に 5 つまで）を 2 つ長く取る。取り消すと、そのコミットの
  # CI が通らなかったことになる（scripts/require-ci.sh）ので、試験が通った時点で main が先に進んでいたら飛ばす。
  snapshot-head:
    name: Snapshot head
    needs: [test, git-minimum, targets, gtk, licenses, vscode]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # main の先頭を読む
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $head; leaving the snapshot to its CI"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  # 作るのは build.yml。署名の鍵は build.yml が環境 release から読む。
  snapshot-build:
    name: Snapshot build
    needs: snapshot-head
    if: needs.snapshot-head.outputs.latest == 'true'
    # actionlint がまだ $/ の書き方を読めないので、./ で呼ぶ。
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # コミットを取ってくる
    with:
      mode: snapshot

  # VSCode 拡張（apps/vscode）に、いま作ったエンジンを同梱して .vsix にする。npm の依存を動かすので、鍵も書き込みの
  # 権限も持たせない。配るものを作るので、npm のキャッシュは使わない。
  snapshot-vsix:
    name: Snapshot VSCode extension
    needs: snapshot-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 拡張の snapshot の版は、前のリリースからのコミット数を数える。
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - working-directory: apps/vscode
        run: |
          npm ci
          scripts/bundle-engine.sh
          version=$(node scripts/snapshot-version.mjs)
          npm pkg set version="$version"
          # vsce は --out のフォルダを作らない。
          mkdir -p ../../dist/vsix
          npx @vscode/vsce package --skip-license --out "../../dist/vsix/amonhen-vscode-$version.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: dist/vsix/*.vsix
          # Release に載せるまでの受け渡しだけなので、長く残さない。
          retention-days: 7
          if-no-files-found: error

  # snapshot という pre-release を、このコミットで作り直す。CI の結果が正式版の確認に使われるので、新しいコミットが
  # 来ても止めない（取り消すと、そのコミットの CI が通らなかったことになる）。代わりに、main がもう先に進んでいたら
  # 載せない。
  snapshot-publish:
    name: Snapshot publish
    needs: [snapshot-build, snapshot-vsix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Release を作る
      # ビルドの由来の証明（artifact attestations）。gh attestation verify で確かめられる。
      id-token: write # 証明に署名する
      attestations: write # 証明を載せる
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist
      # リリースに載せるファイルに、このコミットのこの CI で作ったことの証明を付ける。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/amonhen-*.tar.gz
            dist/amonhen-vscode-*.vsix
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ needs.snapshot-build.outputs.zip }}
          VERSION: ${{ needs.snapshot-build.outputs.version }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $head; leaving the snapshot to its CI"
            exit 0
          fi
          gh release delete snapshot --yes --cleanup-tag || true
          gh release create snapshot "$ZIP" dist/amonhen-*.tar.gz dist/amonhen-*-windows-*.zip dist/amonhen-vscode-*.vsix --prerelease \
            --target "$GITHUB_SHA" --title "Snapshot $VERSION" \
            --notes "The latest main ($VERSION), rebuilt whenever CI passes. Signed but not notarized: install it with \`scripts/install-app.sh snapshot\` (also \`install-engine.sh\` and \`install-vscode.sh\`), see the README."
