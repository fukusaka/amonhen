name: Snapshot

# main の CI が通ったコミットで、snapshot という pre-release を作り直す（テストが落ちたコミットは配らない）。
# 作るのは build.yml。ここでは拡張の .vsix を作り、証明を付けて載せる。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  # ビルドの由来の証明（artifact attestations）。gh attestation verify で確かめられる。
  id-token: write
  attestations: write

# 新しいコミットの CI が通ったら、前の snapshot の作成はやめる。
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    uses: ./.github/workflows/build.yml
    with:
      mode: snapshot
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  # 鍵は持たない（npm の依存を動かすので）。
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # 拡張の snapshot の版は、前のリリースからのコミット数を数える。
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      # VSCode 拡張（apps/vscode）に、いま作ったエンジンを同梱して .vsix にする。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - working-directory: apps/vscode
        run: |
          npm ci
          scripts/bundle-engine.sh
          version=$(node scripts/snapshot-version.mjs)
          npm pkg set version="$version"
          npx @vscode/vsce package --skip-license --out "../../dist/amonhen-vscode-$version.vsix"
      # リリースに載せるファイルに、このコミットのこの CI で作ったことの証明を付ける。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/amonhen-*.tar.gz
            dist/amonhen-vscode-*.vsix
      # snapshot という pre-release を、このコミットで作り直す。
      - env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release delete snapshot --yes --cleanup-tag || true
          gh release create snapshot "$ZIP" dist/amonhen-*.tar.gz dist/amonhen-*-windows-*.zip dist/amonhen-vscode-*.vsix --prerelease \
            --target "$SHA" --title "Snapshot $VERSION" \
            --notes "The latest main ($VERSION), rebuilt whenever CI passes. Signed but not notarized: install it with \`scripts/install-app.sh snapshot\` (also \`install-engine.sh\` and \`install-vscode.sh\`), see the README."
