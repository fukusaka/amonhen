name: Snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write
  # ビルドの由来の証明（artifact attestations）。gh attestation verify で確かめられる。
  id-token: write
  attestations: write

# 新しい push が来たら、前の snapshot の作成はやめる。
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  windows-engine:
    uses: ./.github/workflows/windows-engine.yml

  snapshot:
    needs: windows-engine
    # 署名と公証の鍵は、環境 release の secret に置く（この仕事だけが読める）。
    environment: release
    runs-on: macos-latest
    env:
      AMONHEN_CERT_P12: ${{ secrets.AMONHEN_CERT_P12 }}
      AMONHEN_CERT_PASSWORD: ${{ secrets.AMONHEN_CERT_PASSWORD }}
      AMONHEN_CERT_NAME: ${{ secrets.AMONHEN_CERT_NAME }}
      # 公証（Developer ID で署名したときだけ通る）。App Store Connect の API キー。なければ公証しない。
      AMONHEN_NOTARY_KEY: ${{ secrets.AMONHEN_NOTARY_KEY }}
      AMONHEN_NOTARY_KEY_ID: ${{ secrets.AMONHEN_NOTARY_KEY_ID }}
      AMONHEN_NOTARY_ISSUER: ${{ secrets.AMONHEN_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Linux 用のエンジン（musl で静的リンク、リンクは zig）。
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - run: brew install zig
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/import-signing-certificate.sh
      - id: build
        run: |
          echo "zip=$(scripts/build-app.sh snapshot | tail -1)" >> "$GITHUB_OUTPUT"
          echo "version=$(scripts/version.sh snapshot)" >> "$GITHUB_OUTPUT"
      # Windows 用のエンジンを足す（dist/engine と、リリースに載せる zip）。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-engine
          path: dist/engine
      - run: |
          for f in dist/engine/amonhen-windows-*.exe; do
            platform=$(basename "$f" .exe | sed 's/^amonhen-//')
            work=$(mktemp -d); cp "$f" "$work/amonhen.exe"
            (cd "$work" && zip -q "$OLDPWD/dist/amonhen-$VERSION-$platform.zip" amonhen.exe)
          done
        env:
          VERSION: ${{ steps.build.outputs.version }}
      # VSCode 拡張（apps/vscode）に、いま作ったエンジンを同梱して .vsix にする。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - id: vsix
        working-directory: apps/vscode
        run: |
          npm ci
          scripts/bundle-engine.sh
          version=$(node scripts/snapshot-version.mjs)
          npm pkg set version="$version"
          npx @vscode/vsce package --skip-license --out "../../dist/amonhen-vscode-$version.vsix"
      # リリースに載せるファイルに、このコミットのこの CI で作ったことの証明を付ける。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/amonhen-*.tar.gz
            dist/amonhen-vscode-*.vsix
      # snapshot という pre-release を、このコミットで作り直す。
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapshot --yes --cleanup-tag || true
          gh release create snapshot "${{ steps.build.outputs.zip }}" dist/amonhen-*.tar.gz dist/amonhen-*-windows-*.zip dist/amonhen-vscode-*.vsix --prerelease \
            --target "$GITHUB_SHA" --title "Snapshot ${{ steps.build.outputs.version }}" \
            --notes "main の最新（${{ steps.build.outputs.version }}）。アプリは scripts/install-app.sh snapshot、VSCode 拡張は scripts/install-vscode.sh snapshot で入れられる。"
