name: Windows Engine

# Windows 用のエンジン（amonhen.exe。CLI と daemon を兼ね、共有の daemon は名前付きパイプで待つ）を、Windows の
# マシンで作る。snapshot・リリースの仕事から呼び、成果物 windows-engine（amonhen-windows-<arch>.exe）を渡す。
on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - shell: bash
        run: |
          mkdir -p out
          for arch in x86_64 aarch64; do
            cargo build --release -p amonhen-cli --target "$arch-pc-windows-msvc"
            cp "target/$arch-pc-windows-msvc/release/amonhen.exe" "out/amonhen-windows-$arch.exe"
          done
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-engine
          path: out/
