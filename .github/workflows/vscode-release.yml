name: VSCode Release

# 拡張（apps/vscode）の正式版。`vscode-v*` タグのコミットで CI が通っていることを確かめ、build.yml でエンジンを作り
# （macOS のものは署名して公証に出す）、同梱した .vsix を作って Release に載せる。アプリの Latest の印は取らない。
on:
  push:
    tags: ['vscode-v*']

permissions:
  contents: write
  # ビルドの由来の証明（artifact attestations）。gh attestation verify で確かめられる。
  id-token: write
  attestations: write
  # CI の結果を読む。
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: タグと package.json の version が一致するか
        run: test "${GITHUB_REF_NAME#vscode-v}" = "$(node -p "require('./apps/vscode/package.json').version")"
      - name: CHANGELOG にこの版の節があるか
        run: scripts/changelog-notes.sh "VSCode extension" "${GITHUB_REF_NAME#vscode-v}" >/dev/null
      - name: このコミットで CI が通っているか
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/require-ci.sh "$GITHUB_SHA"

  build:
    uses: ./.github/workflows/build.yml
    with:
      # 同梱するエンジンの版は snapshot の版（エンジンの正式版とは別に出すので）。
      mode: snapshot
      notarize: true
      app: false
    secrets: inherit

  # 鍵は持たない（npm の依存を動かすので）。
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - working-directory: apps/vscode
        run: |
          npm ci
          scripts/bundle-engine.sh
          npx @vscode/vsce package --skip-license
      # .vsix に、このタグのこの CI で作ったことの証明を付ける。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/vscode/*.vsix
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-notes.sh "VSCode extension" "${GITHUB_REF_NAME#vscode-v}" > notes.md
          gh release create "$GITHUB_REF_NAME" apps/vscode/*.vsix --title "VSCode $GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag --latest=false
