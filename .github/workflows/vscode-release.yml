name: VSCode Release

# 拡張（apps/vscode）の正式版。`vscode-v*` タグから、エンジンを作って同梱した .vsix を作る
on:
  push:
    tags: ['vscode-v*']

permissions:
  contents: write
  # ビルドの由来の証明（artifact attestations）。gh attestation verify で確かめられる。
  id-token: write
  attestations: write

jobs:
  windows-engine:
    uses: ./.github/workflows/windows-engine.yml

  release:
    needs: windows-engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # 同梱するエンジンの版（snapshot の版）は、前のリリースからのコミット数を数える。
          fetch-depth: 0
      - name: タグと package.json の version が一致するか
        run: test "${GITHUB_REF_NAME#vscode-v}" = "$(node -p "require('./apps/vscode/package.json').version")"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Linux 用のエンジン（musl で静的リンク、リンクは zig）。
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - run: brew install zig
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/build-engine.sh
      # Windows 用のエンジンも同梱する。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-engine
          path: dist/engine
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - working-directory: apps/vscode
        run: |
          npm ci
          npm test
          scripts/bundle-engine.sh
          npx @vscode/vsce package --skip-license
      # .vsix に、このタグのこの CI で作ったことの証明を付ける。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/vscode/*.vsix
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/vscode/*.vsix --title "VSCode $GITHUB_REF_NAME" --generate-notes --verify-tag --latest=false
