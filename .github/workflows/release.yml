name: Release

on:
  push:
    # アプリとエンジン（v0.1.0 など）。拡張の vscode-v* は vscode-release.yml
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  windows-engine:
    uses: ./.github/workflows/windows-engine.yml

  release:
    needs: windows-engine
    runs-on: macos-latest
    env:
      # 自己署名のコード署名用証明書（.p12 を base64 にしたもの）とそのパスワード。なければ ad-hoc 署名。
      AMONHEN_CERT_P12: ${{ secrets.AMONHEN_CERT_P12 }}
      AMONHEN_CERT_PASSWORD: ${{ secrets.AMONHEN_CERT_PASSWORD }}
      AMONHEN_CERT_NAME: ${{ secrets.AMONHEN_CERT_NAME }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: タグと Cargo.toml の version が一致するか
        run: test "${GITHUB_REF_NAME#v}" = "$(scripts/version.sh stable)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Linux 用のエンジン（musl で静的リンク、リンクは zig）。
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - run: brew install zig
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: scripts/import-signing-certificate.sh
      - id: build
        run: echo "zip=$(scripts/build-app.sh stable | tail -1)" >> "$GITHUB_OUTPUT"
      # Windows 用のエンジンを足す（dist/engine と、リリースに載せる zip）。
      - uses: actions/download-artifact@v4
        with:
          name: windows-engine
          path: dist/engine
      - run: |
          for f in dist/engine/amonhen-windows-*.exe; do
            platform=$(basename "$f" .exe | sed 's/^amonhen-//')
            work=$(mktemp -d); cp "$f" "$work/amonhen.exe"
            (cd "$work" && zip -q "$OLDPWD/dist/amonhen-${VERSION#v}-$platform.zip" amonhen.exe)
          done
        env:
          VERSION: ${{ github.ref_name }}
      - env:
          GH_TOKEN: ${{ github.token }}
        # アプリの zip と、エンジンだけの tar.gz（darwin-aarch64・linux-x86_64・linux-aarch64）と zip（Windows）。
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" dist/amonhen-*.tar.gz dist/amonhen-*-windows-*.zip --title "$GITHUB_REF_NAME" --verify-tag
