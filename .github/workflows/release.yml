name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx @vscode/vsce package --skip-license
      - run: gh release create "$GITHUB_REF_NAME" *.vsix --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
