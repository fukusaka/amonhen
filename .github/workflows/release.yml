name: release

# `npm version patch && git push --follow-tags` で作った v* タグから正式版を作る
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npx @vscode/vsce package --skip-license
      - run: gh release create "$GITHUB_REF_NAME" *.vsix --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
