<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60" viewBox="0 0 100 60">
  <defs>
    <linearGradient id="lin" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#f00"/>
      <stop offset="0.5" stop-color="#0f0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00f"/>
    </linearGradient>
    <radialGradient id="rad" cx="75" cy="30" r="20" fx="70" fy="25" gradientUnits="userSpaceOnUse" gradientTransform="rotate(20 75 30)">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
  </defs>
  <rect x="5" y="5" width="45" height="50" fill="url(#lin)"/>
  <g opacity="0.6" style="mix-blend-mode:multiply">
    <ellipse cx="75" cy="30" rx="20" ry="25" fill="url(#rad)"/>
    <rect x="40" y="20" width="30" height="20" fill="#fc0"/>
  </g>
</svg>
