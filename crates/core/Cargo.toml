[package]
name = "amonhen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
sha1_smol = "1.0.1"

[dependencies]
amonhen-layout.workspace = true
amonhen-model = { workspace = true, features = ["serde"] }
amonhen-pele = { workspace = true, optional = true }
amonhen-math = { workspace = true, optional = true }
amonhen-dot = { workspace = true, optional = true }
amonhen-projection.workspace = true
amonhen-syntax = { workspace = true, optional = true }
arc-swap = "1.9.2"
gix-date = "0.18.0"
imara-diff = "0.2.0"
memmap2 = "0.9.11"
regex = "1.13.1"
roxmltree = "0.20.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha1_smol = "1.0.1"
pulldown-cmark = { version = "0.13.6", default-features = false }

[features]
# 構文の色付け（tree-sitter）。文法は C で書かれていて、ターゲットごとの C コンパイラが要る。
syntax = ["dep:amonhen-syntax"]
# Markdown の Mermaid の図（pele の移植）と Graphviz の DOT の図。アプリ（FFI・GTK4）とエンジン（CLI・daemon。VSCode 拡張が使う）が入れる。
diagrams = ["dep:amonhen-pele", "dep:amonhen-dot"]
# Markdown の数式（RaTeX）。図と同じく、アプリ（FFI・GTK4）とエンジン（CLI・daemon。VSCode 拡張が使う）が入れる。
math = ["dep:amonhen-math"]

[dev-dependencies]
amonhen-backend-cli = { path = "../backend-cli" }
amonhen-backend-gix = { path = "../backend-gix" }
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "authors"
harness = false
