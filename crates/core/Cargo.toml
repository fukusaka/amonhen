[package]
name = "amonhen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
amonhen-layout.workspace = true
amonhen-model = { workspace = true, features = ["serde"] }
amonhen-projection.workspace = true
amonhen-syntax = { workspace = true, optional = true }
arc-swap = "1.9.2"
imara-diff = "0.2.0"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"

[features]
# 構文の色付け（tree-sitter）。文法は C で書かれていて、ターゲットごとの C コンパイラが要る。
syntax = ["dep:amonhen-syntax"]

[dev-dependencies]
amonhen-backend-cli = { path = "../backend-cli" }
amonhen-backend-gix = { path = "../backend-gix" }
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "graph"
harness = false
