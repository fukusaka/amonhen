[package]
name = "amonhen-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
amonhen-layout.workspace = true
amonhen-model = { workspace = true, features = ["serde"] }
lz4_flex = "0.14.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha1_smol = "1.0.1"

[dev-dependencies]
amonhen-backend-gix.workspace = true
amonhen-core.workspace = true
tempfile = "3.27.0"
amonhen-projection.workspace = true
serde_json = "1.0.154"
