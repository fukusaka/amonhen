[package]
name = "amonhen-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
amonhen-layout.workspace = true
amonhen-model = { workspace = true, features = ["serde"] }
lz4_flex = "0.14.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha1_smol = "1.0.1"

[build-dependencies]
sha1_smol = "1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
interprocess = { version = "2.4.6", default-features = false }
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
amonhen-backend-gix.workspace = true
amonhen-core.workspace = true
tempfile = "3.27.0"
amonhen-projection.workspace = true
serde_json = "1.0.154"
