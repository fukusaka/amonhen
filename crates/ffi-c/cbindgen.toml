language = "C"
include_guard = "AMONHEN_H"
header = """/* cbindgen が生成する。手で編集しないこと。
 *
 * ハンドル・文字列・コミットの ID（20 バイト）の引数に NULL を渡すと、関数は何もせず、理由を
 * `amonhen_last_error` に残して失敗を返す（NULL・false・0・-1、ビューは空のもの。解放する関数は何もしない）。
 * 書く先（`out` など）が NULL なら書かない（配列は 0 個として、全体の数だけ返す）。読む配列は個数が 0 なら NULL で
 * よく、個数があるのに NULL なら失敗を返す。
 * NULL でないハンドルは、それを返した関数のもので、まだ解放していないこと。 */"""
style = "type"
cpp_compat = true

[parse]
parse_deps = true
include = ["amonhen-layout"]

[export]
include = ["StrRef", "Node", "Edge", "DiffRow", "Highlight", "SyntaxSpan"]
prefix = ""

[export.rename]
"StrRef" = "AmonhenStrRef"
"Node" = "AmonhenNode"
"Edge" = "AmonhenEdge"
"DiffRow" = "AmonhenDiffRow"
"Highlight" = "AmonhenHighlight"
"SyntaxSpan" = "AmonhenSyntaxSpan"

[enum]
prefix_with_name = true
