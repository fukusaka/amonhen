[package]
name = "amonhen-ffi-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
amonhen-backend-cli.workspace = true
amonhen-backend-gix.workspace = true
amonhen-core.workspace = true
amonhen-layout.workspace = true
amonhen-model = { workspace = true, features = ["serde"] }
amonhen-watch.workspace = true
amonhen-projection.workspace = true
amonhen-remote.workspace = true
serde_json = "1.0.154"

[features]
default = ["syntax"]
syntax = ["amonhen-core/syntax"]

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
tempfile = "3"
