# 配るもの（アプリ・エンジン・拡張に同梱したエンジン）に入る依存のライセンスの一覧を作る設定
# （scripts/third-party-notices.sh が cargo about で使う）。ビルドのときだけ使う依存と試験だけの依存は入らない。
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
]
# 配るエンジンとアプリの OS と CPU。
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Amon Hen 自身の crate（公開しない）は入れない。
private = { ignore = true }
