[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.8"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
amonhen-layout = { path = "crates/layout" }
amonhen-model = { path = "crates/model" }
amonhen-core = { path = "crates/core" }
amonhen-projection = { path = "crates/projection" }
amonhen-platform = { path = "crates/platform" }
amonhen-backend-gix = { path = "crates/backend-gix" }
amonhen-backend-cli = { path = "crates/backend-cli" }
amonhen-ffi-c = { path = "crates/ffi-c" }
amonhen-watch = { path = "crates/watch" }
amonhen-syntax = { path = "crates/syntax" }
amonhen-remote = { path = "crates/remote" }
amonhen-daemon = { path = "crates/daemon" }
amonhen-front = { path = "crates/front" }
gix = { version = "0.89", default-features = false, features = ["sha1", "max-performance-safe", "revision", "attributes", "blob-diff", "mailmap"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
